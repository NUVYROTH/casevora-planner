<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casevoras QA Planner｜品研工作行事曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--navy:#16213a;--navy2:#16213a;--bg:#f5efe3;--card:#fffdf8;--ink:#16213a;--muted:#5d6779;--line:#e3d9c6;--gold:#b8955a;--gold-d:#9a7640;--field:#c9bda6;
 --blue:#2563eb;--blue-s:#e6eeff;--green:#15803d;--green-s:#e3f5ea;--teal:#0f766e;--teal-s:#d9f3ef;--red:#c62828;--red-s:#fde8e8;--amber:#b45309;--amber-s:#fff1d6;--gray-s:#efe6d5;--ind:#4338ca;--ind-s:#ebe9ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.55}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;max-width:1440px;margin:0 auto;padding:18px 16px;align-items:start}
.layout>*{min-width:0}
header.topbar{background:var(--navy);color:#fffdf8;border-bottom:3px solid var(--gold)}
.tbin{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.tb-brand{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 1px rgba(184,149,90,.5),0 2px 8px rgba(0,0,0,.35)}
.bname{font:400 42px/1.05 "Pinyon Script",Georgia,"Times New Roman",serif;color:#e2c891}
.bsub{font-size:15px;font-weight:700;opacity:.92;letter-spacing:.16em;margin-top:2px}
.tbmeta{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:10px}
.ver{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 8px;font-size:11.5px}
aside{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px}
aside .slab{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.08em;padding:4px 10px 6px}
aside button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:9px 10px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
aside button:hover{background:#f3ece0;color:var(--ink)}
aside button.on,aside button.on:hover{background:var(--navy);color:#fffdf8}
aside .ic{width:26px;height:26px;border-radius:8px;background:#efe6d5;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
aside button.on .ic{background:var(--gold)}
aside .nm2{flex:1}
aside .cnt{background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;font-weight:700}
aside .sfoot{margin-top:10px;padding:8px 10px 2px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.6}
main{padding:0 0 96px;width:100%}
h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(22,33,58,.06)}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px}
button:hover{background:#f3ece0}
button.primary{background:var(--navy2);border-color:var(--navy2);color:#fff;font-weight:700}
button.primary:hover{background:#22304f}
button.danger{color:var(--red);border-color:#f0b9b9}
button.sm{padding:3px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:inherit}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,149,90,.25)}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:3px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 14px}
.muted{color:var(--muted)}.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left}
.stat .n{font-size:24px;font-weight:800;line-height:1.2}.stat .l{font-size:13px;color:var(--muted);font-weight:700}
.stat.red .n{color:var(--red)}.stat.green .n{color:var(--green)}.stat.amber .n{color:var(--amber)}.stat.blue .n{color:var(--blue)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px}
.kpi .k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 18px;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(22,33,58,.06);position:relative;overflow:hidden}
.kpi .k:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi .k.red.hot:before{background:var(--red)}
.kpi .k:hover{border-color:var(--gold)}
.kpi .kl{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .kn{font-size:34px;font-weight:800;line-height:1.15;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:13px;color:var(--muted)}
.kpi .k.blue .kn{color:var(--ink)}.kpi .k.amber .kn{color:var(--amber)}.kpi .k.red .kn{color:var(--red)}.kpi .k.green .kn{color:var(--green)}
.kpi .k.red.hot{border-color:#f0b9b9;background:#fff7f7}
.minis{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}
.minis a{color:var(--navy2);font-weight:700;text-decoration:none}
.task{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;border:1px solid var(--line);border-left:5px solid var(--blue);margin-bottom:7px;background:var(--card);cursor:pointer}
.task .mid{flex:1;min-width:0}.task .nm{font-weight:700}
.task .sb{font-size:12px;color:var(--muted)}
.task.s-逾期{border-left-color:var(--red);background:#fff7f7}
.task.s-已完成{border-left-color:var(--green);background:var(--green-s)}
.task.s-待追蹤{border-left-color:var(--amber)}
.task.s-未開始{border-left-color:#8b97b3}
.task.next{border-left-color:var(--ind);background:var(--ind-s)}
.task.next.s-已完成{border-left-color:var(--teal);background:var(--teal-s)}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.b-未開始{background:var(--gray-s);color:#44506b}.b-進行中{background:var(--blue-s);color:var(--blue)}.b-待追蹤{background:var(--amber-s);color:var(--amber)}.b-已完成{background:var(--green-s);color:var(--green)}.b-逾期{background:var(--red-s);color:var(--red)}
.tag{display:inline-block;background:var(--gray-s);color:#44506b;border-radius:6px;padding:0 6px;font-size:12px;margin-right:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:13px;color:var(--muted);font-weight:700;padding:4px 0}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:3px 4px;background:var(--card);cursor:pointer;overflow:hidden}
.cal .d.out{background:#f8f3ea;color:#a9a294}.cal .d.we{background:#faf6ee}
.cal .d.today{border:2px solid var(--navy2)}.cal .d.sel{outline:2px solid var(--blue)}
.cal .d .num{font-size:13px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);margin-bottom:12px}
.seg button{border:0;border-radius:0;padding:8px 16px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--navy);color:#fffdf8}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk .wd{border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:160px;padding:6px;min-width:0}
.wk .wd.we{background:#faf6ee}.wk .wd.today{border:2px solid var(--navy2)}
.wk .wh{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:4px;display:flex;justify-content:space-between;gap:4px}
.wk .wh span{color:var(--muted);font-weight:700}
.wk .wt{display:block;width:100%;text-align:left;font-size:12px;border-radius:7px;padding:4px 6px;margin-top:4px;border:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.wk .wn{font-size:12px;color:#a8b1c6;margin-top:6px}
.bar{height:10px;background:var(--gray-s);border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.phead .pt{flex:1;min-width:200px}.phead h1{margin:0}
.hg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:stretch;margin-bottom:14px}
.hg>.card{margin:0;min-width:0}
.chd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}.chd h2{margin:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bm,.chart g:hover .bm{opacity:.8}
.ctip{position:fixed;pointer-events:none;background:var(--navy);color:#fffdf8;font-size:12.5px;padding:5px 9px;border-radius:8px;z-index:90;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mc .h{font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.mc button{border:0;background:none;padding:6px 0 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:40px}
.mc button:hover{background:#f3ece0}
.mc button.out{color:#bdb5a5}
.mc button.td span{background:var(--navy);color:#fffdf8;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center}
.mc i{width:6px;height:6px;border-radius:50%;display:block}
.mc i.o{background:var(--gold)}.mc i.r{background:var(--red)}.mc i.g{background:var(--green)}.mc i.n{background:transparent}
.mlg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.mlg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.ptab{width:100%;border-collapse:collapse;font-size:14px}
.ptab th{font-size:12.5px;color:var(--muted);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.ptab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptab tr.rw{cursor:pointer}.ptab tr.rw:hover td{background:#faf6ee}
.ptab .tn{font-weight:700}
.chip{display:block;font-size:11px;border-radius:5px;padding:0 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-未開始{background:var(--gray-s);color:#44506b}.c-進行中{background:var(--blue-s);color:var(--blue)}.c-待追蹤{background:var(--amber-s);color:var(--amber)}.c-已完成{background:var(--green-s);color:var(--green)}.c-逾期{background:var(--red-s);color:var(--red)}
.empty{text-align:center;padding:20px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(20,30,60,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--card);border-radius:16px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,calc((100vw - 1440px)/2 + 234px));z-index:5}
.dirty{color:var(--amber);font-weight:700;font-size:14px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 20px;border-radius:999px;z-index:99;font-weight:700;max-width:92vw;text-align:center}
.notice{border-radius:10px;padding:9px 12px;font-size:14px;margin:8px 0;background:var(--amber-s);color:#6b3a07}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}th{color:var(--muted)}
@media(max-width:860px){
 aside{position:static;flex-direction:row;overflow-x:auto;padding:6px;gap:4px}
 aside .slab,aside .sfoot{display:none}
 aside button{width:auto;white-space:nowrap;padding:8px 10px}
 main{padding:0 0 96px}
 .savebar{left:0;padding:10px 12px}
 .cal .d{min-height:56px}.chip{font-size:10px}
 .kpi{grid-template-columns:repeat(2,1fr);gap:10px}.kpi .kn{font-size:28px}
 .hg{grid-template-columns:1fr}
 .ptab .cdue,.ptab .cfile{display:none}
 .logo{width:50px;height:50px}.bname{font-size:34px}.bsub{font-size:13px;letter-spacing:.12em}.tbmeta{display:none}
 .layout{grid-template-columns:1fr;padding:12px 12px;gap:12px}
 .wk{grid-template-columns:1fr;gap:6px}.wk .wd{min-height:0;display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:start}.wk .wh{flex-direction:column;justify-content:flex-start;margin:0}.wk .wt{font-size:13px;margin-top:0;margin-bottom:4px;white-space:normal}.wk .wn{margin-top:2px}
 .seg button{padding:8px 12px}
}
</style>
</head>

const CATS=['日常','法規','HACCP','VACCP','客訴','廠內異常','儀器校正','病媒防治','委外檢驗','稽核','管理審查','供應商','模擬回收','保險','教育訓練','標示','其他'];
const ADHOC=['客戶客訴案件','廠內異常矯正與處理','新供應商審核','供應商現場評鑑','HACCP文件異動','產品標示及包材修改','客戶佐證文件提供','實際產品回收事件','SOP修訂','主管交辦事項','其他'];
const STS=['未開始','進行中','待追蹤','已完成'];
const FREQ={daily:'每日',weekly:'每週',monthly:'每月',quarterly:'每季',semiannual:'每半年',annual:'每年'};
const EVENTS=[{id:'ev1',label:'收到委外檢驗報告',name:'委外檢驗報告審閱及歸檔',cat:'委外檢驗'},{id:'ev2',label:'取得委外檢驗報告',name:'非追不可 QR Code 資料更新',cat:'委外檢驗'},{id:'ev3',label:'模擬回收完成',name:'模擬回收紀錄彙整及呈簽',cat:'模擬回收'}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return fd(d);}
function dim(y,m){return new Date(y,m,0).getDate();}
function ymd(y,m,d){return `${y}-${p2(m)}-${p2(Math.min(d,dim(y,m)))}`;}
function dow(s){return (pd(s).getDay()+6)%7;} // Mon=0
function wkStart(s){return addDays(s,-dow(s));}
function mStart(s){return s.slice(0,7)+'-01';}
function mEnd(s){const [y,m]=s.split('-').map(Number);return ymd(y,m,31);}
function nextMonth(s){const [y,m]=s.split('-').map(Number);return m===12?`${y+1}-01-01`:`${y}-${p2(m+1)}-01`;}
function validD(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')&&fd(pd(s))===s;}
function fmt(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${y}/${+m}/${+d}`;}
function md(s){const [,m,d]=s.split('-');return `${+m}/${+d}`;}
function newId(){return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function flash(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
function showMsg(msg){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><div style="font-weight:700;white-space:pre-line;margin-bottom:14px">${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="primary" id="msgOk">知道了</button></div></div>`;document.body.appendChild(m);m.querySelector('#msgOk').onclick=()=>m.remove();m.querySelector('#msgOk').focus();}
function askYN(msg,yes,o){o=o||{};const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><div style="font-weight:700;white-space:pre-line;margin-bottom:14px">${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button id="ynNo">${esc(o.no||'取消')}</button><button id="ynYes" class="${o.danger?'danger':'primary'}">${esc(o.yes||'確定')}</button></div></div>`;document.body.appendChild(m);m.querySelector('#ynNo').onclick=()=>m.remove();m.querySelector('#ynYes').onclick=()=>{m.remove();yes();};m.querySelector('#ynNo').focus();}
function download(c,n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* ---------- 初始定期工作（依你的文件） ---------- */
function seedTpls(){
  const s=mStart(today()), L=[];
  const add=(name,cat,freq,rule,extra)=>L.push(Object.assign({id:'t'+p2(L.length+1),name,category:cat,freq,rule,sop:'',path:'',desc:'',remind:7,active:true,start:s},extra||{}));
  ['EasyFlow系統訊息確認','Chat主管群組及工作群組確認','主管交辦事項'].forEach(n=>add(n,'日常','daily',{}));
  add('客訴及異常案件追蹤','客訴','daily',{});
  add('更新客訴統計表','客訴','weekly',{weekday:4});
  add('非追不可申報','法規','monthly',{day:10});
  [['食品安全法規管理','法規'],['HACCP食安小組會議資料','HACCP'],['VACCP新增原物料評估','VACCP'],['客訴案件彙整','客訴'],['廠內異常案件彙整','廠內異常'],['病媒防治報告審閱及成效檢討','病媒防治']].forEach(([n,c])=>add(n,c,'monthly',{day:15}));
  [['預約下個月病媒防治','病媒防治'],['病媒防治公告','病媒防治'],['產品標示規範檢視','標示']].forEach(([n,c])=>add(n,c,'monthly',{day:30}));
  add('內部校正通知及計畫','儀器校正','quarterly',{offset:0,day:30});
  add('委外檢驗取樣明細','委外檢驗','quarterly',{offset:0,day:30});
  add('委外檢驗樣品寄送','委外檢驗','quarterly',{offset:1,day:30});
  add('完成內部校正','儀器校正','quarterly',{offset:2,day:30});
  add('第一次模擬回收','模擬回收','semiannual',{months:[4],day:30});
  add('第二次模擬回收','模擬回收','semiannual',{months:[9],day:30});
  add('非登不可資料確認','法規','annual',{month:7,day:30});
  add('病媒防治廠商評估','病媒防治','annual',{month:8,day:30});
  add('管理審查','管理審查','annual',{month:10,day:30});
  add('產品責任保險資料更新','保險','annual',{month:11,day:1},{desc:'11 月 1 日起開始辦理（期限可自行修改）'});
  [['供應商品質穩定度統計','供應商'],['下一年度外部校正計畫','儀器校正'],['下一年度委外檢驗計畫及預算','委外檢驗']].forEach(([n,c])=>add(n,c,'annual',{month:12,day:20}));
  [['下一年度內部稽核計畫','稽核'],['HACCP年度再確認','HACCP'],['VACCP年度脆弱性評估','VACCP'],['食品詐欺預防措施評核','VACCP'],['下一年度食安品質教育訓練主題建議','教育訓練']].forEach(([n,c])=>add(n,c,'annual',{month:12,day:30}));
  return L;
}
let TASKS=load(KT,[]), TPLS=load(KP,null);
function load(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v===null?def:v;}catch(e){return def;}}
if(!Array.isArray(TPLS)||!TPLS.length){TPLS=seedTpls();}
function persist(){try{localStorage.setItem(KT,JSON.stringify(TASKS));localStorage.setItem(KP,JSON.stringify(TPLS));return true;}catch(e){showMsg('儲存失敗！瀏覽器的儲存空間可能已滿。請先「下載備份」再整理資料。');return false;}}
const live=()=>TASKS.filter(t=>!t.deleted);
function eff(t){if(t.status==='已完成')return '已完成';return t.due<today()?'逾期':t.status;}
function ruleText(t){const r=t.rule||{};return {daily:'每個上班日（週一至週五）',weekly:'每週'+'一二三四五六日'[r.weekday??4],monthly:`每月 ${r.day} 日前`,quarterly:`每季第 ${(r.offset||0)+1} 個月 ${r.day} 日前`,semiannual:`每年 ${monthsOf(r).join('、')} 月 ${r.day} 日前`,annual:`每年 ${monthsOf(r).join('、')} 月 ${r.day} 日前`}[t.freq];}

/* ---------- 週期產生 ---------- */
function monthsOf(r){return Array.isArray(r.months)&&r.months.length?r.months:[r.month];}
function occ(t,from,to){
  const out=[], a=from<t.start?t.start:from, r=t.rule||{}; if(a>to) return out;
  if(t.freq==='daily'||t.freq==='weekly'){ let g=0; for(let d=a;d<=to&&g++<800;d=addDays(d,1)){ const w=dow(d); if(t.freq==='daily'?w<5:w===(r.weekday??4)) out.push(d);} return out; }
  let [y,m]=a.split('-').map(Number); const [ty,tm]=to.split('-').map(Number); let g=0;
  while((y<ty||(y===ty&&m<=tm))&&g++<600){
    let d=null;
    if(t.freq==='monthly') d=ymd(y,m,r.day);
    else if(t.freq==='quarterly'){ if(((m-1)%3)===(r.offset||0)) d=ymd(y,m,r.day); }
    else if(monthsOf(r).includes(m)) d=ymd(y,m,r.day);
    if(d&&d>=a&&d<=to) out.push(d);
    m++; if(m>12){m=1;y++;}
  }
  return out;
}
function mk(t,due){return {id:newId(),tplId:t.id,key:t.id+'|'+due,kind:'regular',name:t.name,category:t.category,freq:FREQ[t.freq],due,origDue:due,status:'未開始',desc:t.desc||'',sop:t.sop||'',path:t.path||'',note:'',doneDate:'',remind:t.remind??7,postpones:[],createdAt:new Date().toISOString()};}
function runGen(){
  const td=today(), keys=new Set(TASKS.map(x=>x.key).filter(Boolean)); let n=0;
  const hs=mStart(td), he=mEnd(nextMonth(td));
  TPLS.filter(t=>t.active).forEach(t=>{
    const ds=t.freq==='daily'?occ(t,td,td):occ(t,hs,he);
    ds.forEach(d=>{const k=t.id+'|'+d; if(!keys.has(k)){keys.add(k);TASKS.push(mk(t,d));n++;}});
  });
  if(n) persist(); return n;
}
function nextOf(task){
  const t=TPLS.find(x=>x.id===task.tplId); if(!t||!t.active) return null;
  const ds=occ(t,addDays(task.due,1),addDays(task.due,800)); return ds[0]?{t,d:ds[0]}:null;
}
function completeTask(id){
  const t=TASKS.find(x=>x.id===id); if(!t||t.status==='已完成') return;
  t.status='已完成'; t.doneDate=today(); let msg='已完成 ✦';
  if(t.kind==='regular'&&t.freq!=='每日'){ const nx=nextOf(t); if(nx&&nx.d>=mStart(today())){ const k=nx.t.id+'|'+nx.d; if(!TASKS.some(x=>x.key===k)){ TASKS.push(mk(nx.t,nx.d)); msg='已完成 ✦ 已產生下一期（'+md(nx.d)+'）'; } else msg='已完成 ✦ 下一期（'+md(nx.d)+'）已在清單'; } }
  persist(); flash(msg);
}
function undoComplete(id){const t=TASKS.find(x=>x.id===id); if(!t) return; t.status='進行中'; t.doneDate=''; persist();}

/* ---------- 導覽 ---------- */
let calMode='month', calW=wkStart(today());
let view='home', cur=null, dirty=false, calM=today().slice(0,7), calSel=today(), lf={q:'',cat:'',st:'',freq:'',range:'month'}, selT=new Set(), prev='home';
const PICON={home:'🏠',cal:'📅',list:'📋',stats:'📊',docs:'📎',adhoc:'📥',tpls:'🔁',trash:'🗑️',sys:'⚙️'};
const PAGES=[['home','工作總覽'],['cal','工作行事曆'],['list','工作清單'],['stats','工作統計分析'],['docs','文件及工作紀錄'],['adhoc','不定期工作'],['tpls','定期工作設定'],['trash','最近刪除'],['sys','系統設定']];
function side(){
  const od=live().filter(t=>eff(t)==='逾期').length, tn=TASKS.filter(t=>t.deleted).length;
  $('#side').innerHTML=`<div class="slab">工作台 WORKSPACE</div>`+PAGES.map(([k,n])=>`<button class="${view===k?'on':''}" onclick="go('${k}')"><span class="ic" aria-hidden="true">${PICON[k]}</span><span class="nm2">${n}</span>${k==='home'&&od?`<span class="cnt">${od}</span>`:''}${k==='trash'&&tn?`<span class="cnt" style="background:#8a8f99">${tn}</span>`:''}</button>`).join('')+`<div class="sfoot"><b>CASEVORAS QA</b><br>個人工作站・本機資料模式</div>`;
}
function go(k,after){ const run=()=>{dirty=false;cur=null;view=k;render();window.scrollTo(0,0);if(after)after();}; if(dirty) askYN('有尚未儲存的修改，確定要離開嗎？',run,{yes:'離開'}); else run(); }
function render(){ side(); ({home:rHome,cal:rCal,list:rList,stats:rStats,docs:rDocs,adhoc:rAdhoc,tpls:rTpls,trash:rTrash,sys:rSys,task:rTask,tplform:rTplForm}[view])(); }

/* ---------- 共用元件 ---------- */
function taskRow(t,o){o=o||{};const s=eff(t);
  const soon=s!=='已完成'&&s!=='逾期'&&t.due>today()&&t.due<=addDays(today(),t.remind??7);
  return `<div class="task s-${s} ${o.next?'next':''}" onclick="openTask('${t.id}')"><div class="mid"><div class="nm">${esc(t.name)}</div>
    <div class="sb"><span class="tag">${esc(t.category)}</span><span class="tag">${esc(t.freq||'單次')}</span>期限 ${md(t.due)}${t.doneDate?`・完成 ${md(t.doneDate)}`:''}${t.postpones&&t.postpones.length?`・延期 ${t.postpones.length} 次`:''}${soon?'・<b style="color:var(--amber)">即將到期</b>':''}</div></div>
    <span class="badge b-${s}">${s}</span>${s!=='已完成'?`<button class="sm primary" onclick="event.stopPropagation();completeTask('${t.id}');render()">完成</button>`:''}</div>`;}
function byDue(a,b){return a.due.localeCompare(b.due)||a.name.localeCompare(b.name);}

/* ---------- 工作總覽 ---------- */
function rHome(){
  const td=today(), L=live(), ws=wkStart(td), we=addDays(ws,6), ms=mStart(td), me=mEnd(td);
  const open=L.filter(t=>t.status!=='已完成');
  const S={today:open.filter(t=>t.due===td),week:open.filter(t=>t.due>=ws&&t.due<=we),month:open.filter(t=>t.due>=ms&&t.due<=me),done:L.filter(t=>t.status==='已完成'&&t.doneDate>=ms&&t.doneDate<=me),
   soon:open.filter(t=>t.due>td&&t.due<=addDays(td,t.remind??7)),over:open.filter(t=>t.due<td),follow:open.filter(t=>t.status==='待追蹤')};
  const kp=(l,n,sub,c,f)=>`<div class="k ${c}" role="button" tabindex="0" onclick="${f}" onkeydown="if(event.key==='Enter')${f}"><div class="kl">${l}</div><div class="kn">${n}</div><div class="ks">${sub}</div></div>`;
  const mDue=L.filter(t=>t.due>=ms&&t.due<=me), mDone=mDue.filter(t=>t.status==='已完成').length, rate=mDue.length?Math.round(mDone/mDue.length*100):null;
  const pend=[...S.over.sort(byDue),...open.filter(t=>t.due>=td&&t.due<=addDays(td,t.remind??7)).sort(byDue)], P=pend.slice(0,10);
  $('#app').innerHTML=`<div class="phead"><div class="pt"><h1>工作總覽</h1><div class="muted small">${fmt(td)}（週${'一二三四五六日'[dow(td)]}）｜打開就知道今天該做什麼</div></div><button class="primary" onclick="addUI()">＋ 新增工作</button></div>
  <div class="kpi">${kp('今日待辦',S.today.length,'尚未完成工作','blue',"setLf({range:'today',st:'未完成'})")}${kp('即將到期',S.soon.length,'提醒期內（預設 7 天）','amber',"setLf({range:'all',st:'即將到期'})")}${kp('逾期工作',S.over.length,S.over.length?'需要優先處理':'目前沒有逾期 ✓','red'+(S.over.length?' hot':''),"setLf({range:'all',st:'逾期'})")}${kp('本月完成率',rate===null?'—':rate+'%',mDue.length?`本月到期 ${mDone} / ${mDue.length} 項已完成`:'本月沒有到期工作','green',"setLf({range:'month',st:''})")}</div>
  <div class="minis"><span>本週待辦 <a href="#" onclick="setLf({range:'week',st:'未完成'});return false">${S.week.length}</a></span><span>本月待辦 <a href="#" onclick="setLf({range:'month',st:'未完成'});return false">${S.month.length}</a></span><span>待追蹤 <a href="#" onclick="setLf({range:'all',st:'待追蹤'});return false">${S.follow.length}</a></span><span>本月已完成 <a href="#" onclick="setLf({range:'month',st:'已完成'});return false">${S.done.length}</a></span></div>
  <div class="hg"><div class="card"><div class="chd"><h2>最近 14 天完成數</h2><span class="small muted">依完成日期・單位：項</span></div><div class="chart">${barChart(L)}</div></div>
   <div class="card"><div class="chd"><h2>${+td.slice(5,7)} 月行事曆</h2><a href="#" class="small" onclick="calMode='month';calM=today().slice(0,7);go('cal');return false">開啟 →</a></div>${miniCal(L)}</div></div>
  <div class="hg"><div class="card"><div class="chd"><h2>待處理工作（${pend.length}）</h2><a href="#" class="small" onclick="setLf({range:'all',st:'未完成'});return false">看全部 →</a></div>
    ${P.length?`<div style="overflow-x:auto"><table class="ptab"><thead><tr><th>工作名稱</th><th>狀態</th><th class="cdue">期限</th><th class="cfile">附件</th><th></th></tr></thead><tbody>${P.map(t=>{const s2=eff(t);return `<tr class="rw" onclick="openTask('${t.id}')"><td><div class="tn">${esc(t.name)}</div><div class="small muted">${esc(t.category)}・${esc(t.freq||'單次')}</div></td><td><span class="badge b-${s2}">${s2}</span></td><td class="cdue" style="white-space:nowrap">${md(t.due)}</td><td class="cfile" data-fc="${t.id}">—</td><td style="text-align:right"><button class="sm primary" onclick="event.stopPropagation();completeTask('${t.id}');render()">完成</button></td></tr>`;}).join('')}</tbody></table></div>${pend.length>10?`<div class="small muted" style="margin-top:6px">只顯示前 10 項（逾期優先）</div>`:''}`:'<div class="empty">目前沒有逾期或即將到期的工作 ✓</div>'}</div>
   <div class="card"><div class="chd"><h2>${td.slice(0,4)} 每月完成率</h2><a href="#" class="small" onclick="go('stats');return false">統計 →</a></div><div class="chart">${lineChart()}</div><div class="small muted">完成率＝該月原定工作中已完成的比例</div></div></div>`;
  fAll().then(a=>{const c={};a.forEach(f=>c[f.taskId]=(c[f.taskId]||0)+1);document.querySelectorAll('[data-fc]').forEach(el=>{const n=c[el.dataset.fc];el.textContent=n?'📎 '+n:'—';});}).catch(()=>{});
  bindTips();
}
function bindTips(){ let tip=null; document.querySelectorAll('[data-tip]').forEach(el=>{
  const show=e=>{ if(!tip){tip=document.createElement('div');tip.className='ctip';document.body.appendChild(tip);} tip.textContent=el.dataset.tip; const r=el.getBoundingClientRect(); tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,r.left+r.width/2-tip.offsetWidth/2))+'px'; tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px'; };
  const hide=()=>{ if(tip){tip.remove();tip=null;} };
  el.addEventListener('mouseenter',show); el.addEventListener('mouseleave',hide); el.addEventListener('focus',show); el.addEventListener('blur',hide); el.addEventListener('touchstart',show,{passive:true}); }); }
function barChart(L){
  const td=today(), D=Array.from({length:14},(_,i)=>addDays(td,i-13)), C=D.map(d=>L.filter(t=>t.status==='已完成'&&t.doneDate===d).length), mx=Math.max(4,...C), top=Math.ceil(mx/2)*2;
  const nar=innerWidth<700, W=nar?340:560,H=nar?190:200,l=24,r=4,t=10,b=24, iw=W-l-r, ih=H-t-b, bw=iw/14, w=Math.min(22,bw*0.6);
  const y=v=>t+ih-v/top*ih; let g='';
  [0,top/2,top].forEach(v=>{g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="${v?'#ece4d4':'#c9bda6'}" stroke-width="1"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5d6779">${v}</text>`;});
  D.forEach((d,i)=>{ const cx=l+bw*i+bw/2, v=C[i], h=v/top*ih, x=cx-w/2, yy=t+ih-h, rr=Math.min(4,h);
    const path=v?`<path class="bm" d="M${x},${t+ih} V${yy+rr} Q${x},${yy} ${x+rr},${yy} H${x+w-rr} Q${x+w},${yy} ${x+w},${yy+rr} V${t+ih} Z" fill="${d===td?'#9a7640':'#16213a'}"/>`:'';
    g+=`<g tabindex="0" data-tip="${md(d)}（週${'一二三四五六日'[dow(d)]}）完成 ${v} 項"><rect class="hit" x="${l+bw*i}" y="${t}" width="${bw}" height="${ih}"/>${path}</g>`;

/* ---------- 工作清單 ---------- */
function filtered(){
  const td=today(), ws=wkStart(td), we=addDays(ws,6), ms=mStart(td), me=mEnd(td), nms=nextMonth(td), nme=mEnd(nms), q=lf.q.trim().toLowerCase();
  return live().filter(t=>{ const s=eff(t);
    if(lf.range==='today'&&t.due!==td) return false; if(lf.range==='week'&&!(t.due>=ws&&t.due<=we)) return false;
    if(lf.range==='month'&&!(t.due>=ms&&t.due<=me)) return false; if(lf.range==='next'&&!(t.due>=nms&&t.due<=nme)) return false;
    if(lf.cat&&t.category!==lf.cat) return false; if(lf.freq&&t.freq!==lf.freq) return false;
    if(lf.st==='未完成'&&s==='已完成') return false; if(lf.st==='即將到期'&&!(s!=='已完成'&&s!=='逾期'&&t.due>td&&t.due<=addDays(td,t.remind??7))) return false;
    if(lf.st&&!['未完成','即將到期'].includes(lf.st)&&s!==lf.st) return false;
    if(q&&!(t.name+' '+t.category+' '+(t.note||'')+' '+(t.desc||'')).toLowerCase().includes(q)) return false; return true;}).sort(byDue);
}

/* ---------- 工作統計分析（計畫 vs 實際） ---------- */
let stY=+today().slice(0,4);
function statRows(y){
  const L=live(), td=today(), out=[];
  for(let m=1;m<=12;m++){ const ms=`${y}-${p2(m)}-01`, me=mEnd(ms), P=L.filter(t=>{const o=t.origDue||t.due;return o>=ms&&o<=me;});
    const D=P.filter(t=>t.status==='已完成'), late=D.filter(t=>t.doneDate>(t.origDue||t.due)), open=P.filter(t=>t.status!=='已完成');
    out.push({m,plan:P.length,done:D.length,ontime:D.length-late.length,late:late.length,open:open.length,over:open.filter(t=>t.due<td).length,rate:P.length?Math.round(D.length/P.length*100):null,future:ms>td}); }
  return out;
}
function rStats(){
  const R=statRows(stY), T=R.reduce((a,r)=>({plan:a.plan+r.plan,done:a.done+r.done,ontime:a.ontime+r.ontime,late:a.late+r.late,open:a.open+r.open}),{plan:0,done:0,ontime:0,late:0,open:0});
  const DU=live().filter(t=>{const o=t.origDue||t.due;return o.slice(0,4)===String(stY)&&o<=today();}), dd=DU.filter(t=>t.status==='已完成').length, tr=DU.length?Math.round(dd/DU.length*100):null, pct=v=>v===null?'—':v+'%';
  $('#app').innerHTML=`<h1>工作統計分析</h1><div class="muted small" style="margin-bottom:12px">計畫（原本期限）vs 實際（完成日期）・可用於管理審查</div>
  <div class="card"><div class="row" style="margin-bottom:10px"><button onclick="stY--;rStats()">← ${stY-1}</button><b style="font-size:17px">${stY} 年</b><button onclick="stY++;rStats()">${stY+1} →</button><span class="spacer"></span><button onclick="exportStats()">匯出統計 CSV</button></div>
   <div class="kpi"><div class="k blue" style="cursor:default"><div class="kl">原定工作</div><div class="kn">${T.plan}</div><div class="ks">依原本期限計算</div></div><div class="k green" style="cursor:default"><div class="kl">實際完成</div><div class="kn">${T.done}</div><div class="ks">已到期工作完成率 ${pct(tr)}</div></div><div class="k amber" style="cursor:default"><div class="kl">延遲完成</div><div class="kn">${T.late}</div><div class="ks">完成日晚於原本期限</div></div><div class="k red" style="cursor:default"><div class="kl">尚未完成</div><div class="kn">${T.open}</div><div class="ks">含還沒到期的工作</div></div></div>
   <div style="overflow-x:auto"><table><thead><tr><th>月份</th><th class="num">原定</th><th class="num">完成</th><th class="num">準時</th><th class="num">延遲</th><th class="num">未完成</th><th class="num">完成率</th><th style="width:28%"></th></tr></thead><tbody>
   ${R.map(r=>`<tr style="${r.future&&!r.plan?'color:#a8b1c6':''}"><td style="white-space:nowrap">${r.m} 月</td><td class="num">${r.plan}</td><td class="num">${r.done}</td><td class="num">${r.ontime}</td><td class="num" style="${r.late?'color:var(--amber);font-weight:700':''}">${r.late}</td><td class="num" style="${r.over?'color:var(--red);font-weight:700':''}">${r.open}${r.over?`（逾期 ${r.over}）`:''}</td><td class="num"><b>${pct(r.rate)}</b></td><td>${r.rate===null?'':`<div class="bar" aria-hidden="true"><i style="width:${r.rate}%"></i></div>`}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="notice small">・<b>延遲完成</b>＝完成日期晚於「原本期限」，就算中間按過「延期」也算延遲。<br>・<b>完成率</b>＝該月原定工作中，已完成的比例。<br>・定期工作只會產生到「下個月」，所以更後面的月份還沒有資料是正常的。<br>・刪除的工作不列入統計。</div></div>`;
}
function exportStats(){const R=statRows(stY);const rows=[['月份','原定','完成','準時','延遲','未完成','完成率'],...R.map(r=>[`${stY}-${p2(r.m)}`,r.plan,r.done,r.ontime,r.late,r.open,r.rate===null?'':r.rate+'%'])];
  download('﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),`qa_planner_stats_${stY}.csv`,'text/csv;charset=utf-8');}

/* ---------- 檔案（IndexedDB，只存在這台裝置這個瀏覽器） ---------- */
const FMAX=20*1024*1024; let _db=null;
function idb(){ if(_db) return Promise.resolve(_db); return new Promise((ok,no)=>{ if(!window.indexedDB){no(new Error('noidb'));return;} const r=indexedDB.open('casevoraQAPlanner_files',1);
  r.onupgradeneeded=()=>{const st=r.result.createObjectStore('files',{keyPath:'id'});st.createIndex('taskId','taskId');};
  r.onsuccess=()=>{_db=r.result;ok(_db);}; r.onerror=()=>no(r.error); }); }
function fx(mode,fn){return idb().then(db=>new Promise((ok,no)=>{const tx=db.transaction('files',mode),st=tx.objectStore('files');let out;const q=fn(st);if(q)q.onsuccess=()=>{out=q.result;};tx.oncomplete=()=>ok(out);tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error);}));}
const fAll=()=>fx('readonly',st=>st.getAll()).then(a=>a||[]);
const fGet=id=>fx('readonly',st=>st.get(id));
const fPut=o=>fx('readwrite',st=>st.put(o));
const fDel=id=>fx('readwrite',st=>st.delete(id));
function fDelTasks(ids){if(!ids.length)return Promise.resolve();return fAll().then(a=>Promise.all(a.filter(f=>ids.includes(f.taskId)).map(f=>fDel(f.id))));}
function fsize(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';}
function fMeta(f){const {blob,...m}=f;return m;}
function idbFail(e){showMsg('檔案功能無法使用：這個瀏覽器不允許儲存檔案（可能是無痕模式或已封鎖網站資料）。\n文字紀錄仍可正常使用。');}
function storeInfo(el){ if(!el) return; if(!(navigator.storage&&navigator.storage.estimate)){el.textContent='';return;}
  navigator.storage.estimate().then(e=>{el.textContent=`這個瀏覽器已使用約 ${fsize(e.usage||0)}，可用上限約 ${fsize(e.quota||0)}（由瀏覽器決定）。`;}).catch(()=>{}); }
function addFiles(taskId,inp){
  const fs=[...inp.files]; inp.value=''; if(!fs.length) return;
  const big=fs.filter(f=>f.size>FMAX); if(big.length){showMsg(`以下檔案超過 20 MB，沒有加入：\n${big.map(f=>f.name).join('\n')}\n\n大檔案建議放雲端硬碟，在備註貼連結。`);}
  const ok=fs.filter(f=>f.size<=FMAX); if(!ok.length) return;
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  Promise.all(ok.map(f=>fPut({id:newId(),taskId,name:f.name,type:f.type||'application/octet-stream',size:f.size,addedAt:today(),blob:f})))
   .then(()=>{flash(`已加入 ${ok.length} 個檔案 ✦`);taskFiles(taskId);}).catch(e=>{ if(e&&e.name==='QuotaExceededError') showMsg('加入失敗：瀏覽器的儲存空間已滿。請先「下載備份」，再刪除不需要的檔案。'); else idbFail(e); });
}
function openFile(id,dl){ fGet(id).then(f=>{ if(!f){showMsg('找不到這個檔案，可能已被刪除。');return;} const u=URL.createObjectURL(f.blob);

function tfCandidate(){const t=tf; return Object.assign({},t,{start:today()});}
function prevTf(){
  const el=$('#tfp'); if(!el) return; const v=tplErr(tf);
  if(v){el.innerHTML='<span class="muted">'+esc(v)+'</span>';return;}
  const ds=occ(tfCandidate(),today(),addDays(today(),800)).slice(0,4);
  el.innerHTML=ds.length?'接下來會在這些日子產生：<b>'+ds.map(fmt).join('、')+'</b>'+(tf.freq==='daily'?'（只有上班日，且只產生當天）':''):'接下來 800 天內沒有符合的日子';
}
function tplErr(t){
  if(!String(t.name).trim()) return '請先填寫：工作名稱';
  const r=t.rule||{}; const day=Number(r.day);
  if(['monthly','quarterly','semiannual','annual'].includes(t.freq)&&!(Number.isInteger(day)&&day>=1&&day<=31)) return '「日」要是 1 到 31';
  if(['semiannual','annual'].includes(t.freq)&&!(Array.isArray(r.months)&&r.months.length)) return '請至少勾選一個月份';
  if(t.freq==='weekly'&&!(r.weekday>=0&&r.weekday<=6)) return '請選擇星期幾';
  if(t.freq==='quarterly'&&![0,1,2].includes(Number(r.offset))) return '請選擇每季的第幾個月';
  const rm=Number(t.remind); if(!(rm>=0&&rm<=90)) return '提前提醒天數要是 0 到 90';
  return '';
}
function rTplForm(){
  const t=tf, r=t.rule||{}; side();
  const wd='一二三四五六日'.split('').map((n,i)=>`<option value="${i}" ${r.weekday===i?'selected':''}>星期${n}</option>`).join('');
  const dayOpt=(sel)=>Array.from({length:31},(_,i)=>`<option value="${i+1}" ${sel===i+1?'selected':''}>${i+1} 日</option>`).join('');
  let rule='';
  if(t.freq==='daily') rule='<div class="muted small">每個上班日（週一至週五）各產生一筆，只產生當天。</div>';
  if(t.freq==='weekly') rule=`<div><label class="f">星期幾（期限）</label><select onchange="setTfRule('weekday',+this.value)">${wd}</select></div>`;
  if(t.freq==='monthly') rule=`<div><label class="f">每月幾日前完成</label><select onchange="setTfRule('day',+this.value)">${dayOpt(r.day)}</select><div class="small muted">遇到沒有這天的月份（例如 30 日遇到 2 月），記在當月最後一天</div></div>`;
  if(t.freq==='quarterly') rule=`<div><label class="f">每季的第幾個月</label><select onchange="setTfRule('offset',+this.value)">${[0,1,2].map(i=>`<option value="${i}" ${(r.offset||0)===i?'selected':''}>第 ${i+1} 個月（${[1,2,3].map(k=>k+i*1+(k-1)*2).join('、')} 月起）</option>`).join('')}</select><div class="small muted">第 1 個月＝1、4、7、10 月；第 2 個月＝2、5、8、11 月；第 3 個月＝3、6、9、12 月</div></div><div><label class="f">幾日前完成</label><select onchange="setTfRule('day',+this.value)">${dayOpt(r.day)}</select></div>`;
  if(t.freq==='semiannual'||t.freq==='annual') rule=`<div style="grid-column:1/-1"><label class="f">哪幾個月（可複選）${t.freq==='semiannual'?'　每半年通常選兩個相隔 6 個月的月份，例如 4 月和 10 月':''}</label><div class="row">${Array.from({length:12},(_,i)=>`<label class="row" style="gap:3px"><input type="checkbox" style="width:auto" ${(r.months||[]).includes(i+1)?'checked':''} onchange="togMonth(${i+1},this.checked)">${i+1} 月</label>`).join('')}</div></div><div><label class="f">幾日前完成</label><select onchange="setTfRule('day',+this.value)">${dayOpt(r.day)}</select></div>`;
  $('#app').innerHTML=`<div class="row" style="margin-bottom:12px"><button onclick="leaveTpl()">← 返回</button><h1 style="margin:0 6px">${tfNew?'新增':'修改'}定期工作</h1></div>
  <div class="card"><div class="grid"><div style="grid-column:1/-1"><label class="f">工作名稱</label><input type="text" value="${esc(t.name)}" oninput="setTf('name',this.value)" placeholder="例如：每月設備清潔檢查"></div>
   <div><label class="f">工作分類</label><select onchange="setTf('category',this.value)">${[...new Set([...CATS,t.category])].map(c=>`<option ${t.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
   <div><label class="f">頻率</label><select onchange="setTfFreq(this.value)">${Object.entries(FREQ).map(([k,n])=>`<option value="${k}" ${t.freq===k?'selected':''}>${n}</option>`).join('')}</select></div>${rule}
   <div><label class="f">提前提醒天數</label><input type="number" min="0" max="90" value="${esc(t.remind)}" oninput="setTf('remind',this.value)"></div>
   <div><label class="f">SOP 依據</label><input type="text" value="${esc(t.sop)}" oninput="setTf('sop',this.value)"></div>
   <div><label class="f">資料存放位置</label><input type="text" value="${esc(t.path)}" oninput="setTf('path',this.value)" placeholder="請用假路徑測試"></div>
   <div style="grid-column:1/-1"><label class="f">工作說明</label><textarea oninput="setTf('desc',this.value)">${esc(t.desc)}</textarea></div></div>
   <div class="notice" id="tfp"></div>${tfNew?'':'<div class="notice">儲存後：還沒開始、期限還沒到的舊工作會依新規則重新產生；已完成、進行中、逾期或延期過的都不會動。</div>'}</div>
  <div class="savebar"><div class="row"><button class="primary" onclick="saveTpl()">儲存</button><button onclick="leaveTpl()">返回</button><span id="dm"></span></div></div>`;
  prevTf();
}
function leaveTpl(){const run=()=>{dirty=false;tf=null;view='tpls';render();window.scrollTo(0,0);};if(dirty)askYN('有尚未儲存的修改，確定要離開嗎？',run,{yes:'離開'});else run();}
function saveTpl(){
  const e=tplErr(tf); if(e){showMsg(e);return;}
  const item=Object.assign({},tf,{name:tf.name.trim(),remind:Number(tf.remind),start:today()});
  if(item.rule.day!==undefined) item.rule.day=Number(item.rule.day);
  const oldT=TPLS.slice(), oldK=TASKS.slice(); let removed=0;
  if(tfNew) TPLS.push(item);
  else{ const i=TPLS.findIndex(x=>x.id===item.id); TPLS[i]=item; const td=today();
    TASKS=TASKS.filter(x=>{ const un=x.tplId===item.id&&x.kind==='regular'&&!x.deleted&&x.status==='未開始'&&x.due>=td&&!(x.postpones&&x.postpones.length); if(un) removed++; return !un; }); }
  const made=item.active?runGen():0; if(!persist()){TPLS=oldT;TASKS=oldK;return;}
  dirty=false; tf=null; view='tpls'; render(); flash(tfNew?`已新增，產生 ${made} 筆工作`:`已儲存：重新產生 ${made} 筆（移除 ${removed} 筆還沒開始的舊工作）`);
}
function delTpl(id){
  const t=TPLS.find(x=>x.id===id); if(!t) return; const n=live().filter(x=>x.tplId===id).length;
  askYN(`確定要刪除定期工作「${t.name}」嗎？\n以後不會再自動產生；已經產生的 ${n} 項工作和歷史紀錄都會保留。\n（如果只是暫時不要，可以改成「停用」。）`,()=>{const old=TPLS.slice();TPLS=TPLS.filter(x=>x.id!==id);if(!persist()){TPLS=old;return;}render();flash('已刪除定期工作');},{yes:'刪除',danger:true});
}

/* ---------- 最近刪除 ---------- */
function trashL(){return TASKS.filter(t=>t.deleted).sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||''));}
function daysB(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function rTrash(){
  const L=trashL(), n=selT.size;
  $('#app').innerHTML=`<h1>最近刪除</h1><div class="card"><div class="notice small">已刪除超過 30 天的工作，會在「下次打開本系統時」永久刪除（不是準時自動）。刪除的定期工作，還原前不會被重新產生。</div>
   <div class="row" style="margin:8px 0"><button onclick="selT=new Set(trashL().map(t=>t.id));rTrash()" ${L.length?'':'disabled'}>全選</button><button onclick="selT=new Set();rTrash()" ${n?'':'disabled'}>全部不選</button><button id="trR" onclick="trashRestore()" ${n?'':'disabled'}>還原</button><button id="trP" class="danger" onclick="trashPerm()" ${n?'':'disabled'}>永久刪除</button><span class="muted small">${n?'已勾選 '+n+' 筆':'請先勾選'}</span></div>
   ${L.length?L.map(t=>`<div class="task" style="cursor:default"><input type="checkbox" style="width:auto" data-id="${t.id}" ${selT.has(t.id)?'checked':''} onchange="this.checked?selT.add('${t.id}'):selT.delete('${t.id}');rTrash()"><div class="mid"><div class="nm">${esc(t.name)}</div><div class="sb">期限 ${fmt(t.due)}・${fmt(t.deletedAt)} 刪除・剩 ${Math.max(30-daysB(t.deletedAt,today()),0)} 天</div></div></div>`).join(''):'<div class="empty">目前沒有刪除的工作</div>'}</div>`;
}
function trashRestore(){const ids=[...selT];if(!ids.length)return;const ch=[];TASKS.forEach(t=>{if(ids.includes(t.id)&&t.deleted){ch.push([t,t.deletedAt]);t.deleted=false;delete t.deletedAt;}});if(!persist()){ch.forEach(([t,d])=>{t.deleted=true;t.deletedAt=d;});return;}selT=new Set();render();flash('已還原 ✦');}
function trashPerm(){const n=selT.size;if(!n)return;askYN(`確定要永久刪除選取的 ${n} 筆嗎？永久刪除後無法復原。`,()=>{const old=TASKS;const gone=[...selT];TASKS=TASKS.filter(t=>!selT.has(t.id));if(!persist()){TASKS=old;return;}fDelTasks(gone).catch(()=>{});selT=new Set();render();flash('已永久刪除');},{yes:'永久刪除',danger:true});}
function purge(){const n=TASKS.length;const gone=TASKS.filter(t=>t.deleted&&t.deletedAt&&today()>addDays(t.deletedAt,30)).map(t=>t.id);if(gone.length)fDelTasks(gone).catch(()=>{});TASKS=TASKS.filter(t=>!(t.deleted&&t.deletedAt&&today()>addDays(t.deletedAt,30)));if(TASKS.length!==n)persist();}

/* ---------- 系統設定：匯出、備份、還原 ---------- */
function rSys(){
  $('#app').innerHTML=`<h1>系統設定</h1><div class="card"><h2>📦 資料</h2><div class="row"><button onclick="exportCSV(true)">匯出全部工作 CSV</button><button onclick="backup()">下載備份</button><button onclick="document.getElementById('rf').click()">從備份還原</button><input type="file" id="rf" accept=".json" hidden onchange="restore(this)"></div></div>
  <div class="card"><h2>資料保存方式與限制（請務必閱讀）</h2><ul class="small"><li><b>本機儲存 · 僅在此裝置此瀏覽器有效 · 可匯出備份。</b>資料存在這台裝置、這個瀏覽器裡，不會上傳，也不會同步。</li>
   <li>換瀏覽器、換電腦、使用無痕視窗，都看不到原本的資料；清除瀏覽資料會讓工作和歷史紀錄全部消失，且無法復原。</li><li>請定期按「下載備份」，把備份檔放在這台電腦以外的地方。</li>
   <li><b>附件檔案</b>也只存在這台裝置、這個瀏覽器（IndexedDB），不會上傳；清除瀏覽資料時檔案會一起消失。「下載備份」會把檔案一起放進備份檔，所以檔案多時備份檔會比較大。<br><span id="ssz" class="muted"></span></li>
   <li>這個版本是<b>原型</b>。請只用<b>假資料與假路徑</b>測試，不要貼公司真實的伺服器路徑、IP 或帳號。</li>
   <li>定期工作是「打開本系統的那一刻」才會產生，系統沒有伺服器，不能在指定日期自己醒來。每日工作只產生「今天」，沒打開的日子不會補。</li></ul></div>`;
  storeInfo($('#ssz'));
}
function csvOf(L){const head=['工作名稱','分類','頻率','預定完成日','原本期限','完成日期','執行狀態','延期次數','SOP依據','資料存放位置','備註'];
  const rows=L.map(t=>[t.name,t.category,t.freq||'單次',t.due,t.origDue,t.doneDate||'',eff(t),(t.postpones||[]).length,t.sop,t.path,t.note]);
  return '﻿'+[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');}
function exportCSV(all){const L=(all?live():filtered()).slice().sort(byDue); if(!L.length){showMsg('目前沒有工作可匯出。');return;} download(csvOf(L),`qa_planner_${today()}.csv`,'text/csv;charset=utf-8');}
function b64(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(r.error);r.readAsDataURL(blob);});}
function unb64(s,type){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type});}
function backup(){
  const ids=new Set(live().map(t=>t.id)); flash('正在準備備份…');
  fAll().catch(()=>[]).then(a=>Promise.all(a.filter(f=>ids.has(f.taskId)).map(f=>b64(f.blob).then(data=>Object.assign(fMeta(f),{data}))))).then(files=>{
    download(JSON.stringify({app:'casevoraQAPlanner',version:2,exportedAt:new Date().toISOString(),tasks:live(),templates:TPLS,files}),`qa_planner_backup_${today()}.json`,'application/json');
    if(files.length) setTimeout(()=>showMsg(`備份已下載，裡面包含 ${files.length} 個附件檔案。\n請把備份檔存到這台電腦以外的地方（例如雲端硬碟）。`),300);
  }).catch(()=>showMsg('備份失敗，請再試一次。'));
}
function restore(inp){
  const f=inp.files[0]; inp.value=''; if(!f) return; const fr=new FileReader();
  fr.onload=()=>{ let d; try{d=JSON.parse(fr.result); if(!d||d.app!=='casevoraQAPlanner'||!Array.isArray(d.tasks)||!Array.isArray(d.templates)) throw 0;}catch(e){showMsg('無法讀取：這不是本工具的備份檔。');return;}
    const badT=d.tasks.some(t=>!t||!String(t.name||'').trim()||!validD(t.due)||!validD(t.origDue||t.due)||!STS.includes(t.status)||(t.status==='已完成'&&!validD(t.doneDate))||!Array.isArray(t.postpones||[]));
    const badP=d.templates.some(t=>!t||!t.id||!FREQ[t.freq]||!t.rule||!validD(t.start));
    if(badT||badP){showMsg('無法還原：備份檔內有格式不正確的'+(badT?'工作':'定期工作設定')+'。');return;}
    askYN(`備份檔內有 ${d.tasks.length} 項工作。\n還原會「取代」目前瀏覽器中的 ${live().length} 項工作與定期工作設定，目前「最近刪除」裡的 ${trashL().length} 項也會一併被取代，確定嗎？`,()=>{
      const oT=TASKS,oP=TPLS; TASKS=d.tasks.map(t=>Object.assign({postpones:[],origDue:t.due,remind:7,note:'',desc:'',sop:'',path:'',doneDate:''},t)); TPLS=d.templates;
      if(!persist()){TASKS=oT;TPLS=oP;return;} runGen();
      if(Array.isArray(d.files)){ fAll().then(a=>Promise.all(a.map(f=>fDel(f.id)))).then(()=>Promise.all(d.files.filter(f=>f&&f.id&&f.taskId&&typeof f.data==='string').map(f=>fPut({id:f.id,taskId:f.taskId,name:String(f.name||'檔案'),type:f.type||'application/octet-stream',size:f.size||0,addedAt:validD(f.addedAt)?f.addedAt:today(),blob:unb64(f.data,f.type||'application/octet-stream')})))).then(()=>{flash('還原完成 ✦（含 '+d.files.length+' 個檔案）');go('home');}).catch(()=>{showMsg('工作已還原，但附件檔案還原失敗（可能是空間不足或無痕模式）。');go('home');}); }
      else { flash('還原完成 ✦（這個備份沒有附件，目前的附件保留不動）'); go('home'); }},{yes:'還原並取代',danger:true}); };
  fr.readAsText(f);
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!dirty&&view!=='task'){if(runGen())render();}});
(function init(){
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){showMsg('注意：目前瀏覽器無法保存資料（可能是無痕模式或已封鎖網站資料），關閉後資料會遺失。');}
  purge(); const n=runGen(); persist(); render(); if(n>0&&TASKS.length===n) showMsg('已依你的設定產生本月與下個月的定期工作（共 '+n+' 筆）。\n過了期限但還沒做的工作會顯示「逾期」，不會自動變成完成。');
})();
</script>
